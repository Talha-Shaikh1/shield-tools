    <rect x="216" y="210" width="80" height="66" rx="16" fill="url(#lockGold)" filter="url(#glow)" />
    <circle cx="256" cy="238" r="7" fill="#0f172a" />
    <path d="M 253 238 L 259 238 L 261 256 L 251 256 Z" fill="#0f172a" />
